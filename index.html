<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>게시판</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>게시판</h1>
        
        <div class="top-bar">
            
        </div>

        <div style="margin-bottom: 20px;">
            <input type="text" id="titleInput" placeholder="제목">
            <input type="text" id="writerInput" placeholder="작성자">
            <input type="date" id="dateInput">
            <button id="writeBtn">글쓰기</button>

            <p id="errorMsg" style="color:red;"></p>
        </div>
    
        <table class="borad-table">
            <thead>
                <tr>
                    <th>번호</th>
                    <th>제목</th>
                    <th>작성자</th>
                    <th>날짜</th>
                    <th>삭제</th>
                </tr>
            </thead>
            <tbody id="boardBody"></tbody>
        </table>

        <div id="detailBox" style="display:none; margin-top:20px;">
            <h2 id="detailTitle"></h2>
            <p id="detailWriter"></p>
            <p id="detailDate"></p>
        </div>

    </div>
    <script src="script.js"></script>
</body>
</html>
